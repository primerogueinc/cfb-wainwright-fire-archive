name: Visibility inputs (METAR, GIBS imagery, canopy height)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy rasterio opentimestamps-client
      - name: Pull inputs
        run: python3 scripts/visibility_inputs.py
      - name: Manifest, timestamp, commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data/visibility -type f -size +95M -delete
          git add data/visibility
          if git diff --cached --quiet; then exit 0; fi
          m=data/manifests/visibility_$(date -u +%Y%m%dT%H%M%SZ).sha256
          find data/visibility -type f | sort | xargs sha256sum > "$m"
          ots stamp "$m" || true
          git add data/visibility data/manifests
          git commit -m "Visibility inputs: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 15; done
          exit 1
