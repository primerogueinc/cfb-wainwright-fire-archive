name: Elevation models (DEM)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dem:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy rasterio pystac-client opentimestamps-client
      - name: Pull DEMs
        run: python3 scripts/dem_pull.py
      - name: Manifest, timestamp, commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find data/dem -type f -size +95M -delete
          git add data/dem
          if git diff --cached --quiet; then exit 0; fi
          m=data/manifests/dem_$(date -u +%Y%m%dT%H%M%SZ).sha256
          find data/dem -type f | sort | xargs sha256sum > "$m"
          ots stamp "$m" || true
          git add data/dem data/manifests
          git commit -m "Elevation models: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 15; done
          exit 1
