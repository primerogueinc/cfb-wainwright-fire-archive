name: Annotated loop

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-commit
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy h5py h5netcdf fsspec aiohttp pyproj matplotlib imageio imageio-ffmpeg pillow opentimestamps-client
      - run: python3 scripts/annotated_loop.py
      - name: Manifest and timestamp
        run: |
          m=data/manifests/goes_annotated_$(date -u +%Y%m%dT%H%M%SZ).sha256
          find data/goes/annotated -type f -not -path '*/work/*' | sort | xargs sha256sum > "$m"
          ots stamp "$m" || echo "::warning::could not stamp $m"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/goes/annotated data/manifests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Annotated GOES-18 loop, Oct 17"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 15; done
          exit 1
