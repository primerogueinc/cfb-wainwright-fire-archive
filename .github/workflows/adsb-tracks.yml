name: ADS-B tracks (adsb.lol archive)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet matplotlib geopandas pyogrio shapely pyproj
      - name: Pull and filter tracks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/adsb_tracks.py 2>&1 | tail -200
      - name: Manifest, timestamp, commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/adsb
          if git diff --cached --quiet; then exit 0; fi
          m=data/manifests/adsb_$(date -u +%Y%m%dT%H%M%SZ).sha256
          find data/adsb -type f | sort | xargs sha256sum > "$m"
          pip install --quiet opentimestamps-client && ots stamp "$m" || true
          git add data/adsb data/manifests
          git commit -m "ADS-B tracks near the base, Oct. 17-18: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 15; done
          exit 1
