name: Infrastructure map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet numpy geopandas pyogrio shapely pyproj matplotlib opentimestamps-client
      - name: Build map
        run: |
          mkdir -p data/infrastructure
          set -o pipefail
          python3 scripts/infrastructure_map.py 2>&1 | tee data/infrastructure/run.log
      - name: Manifest, timestamp, commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/infrastructure
          if git diff --cached --quiet; then exit 0; fi
          m=data/manifests/infrastructure_$(date -u +%Y%m%dT%H%M%SZ).sha256
          find data/infrastructure -type f -not -path '*/cache/*' | sort | xargs sha256sum > "$m"
          pip install --quiet opentimestamps-client && ots stamp "$m" || true
          git add data/infrastructure data/manifests
          git commit -m "Infrastructure map: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 15; done
          exit 1
